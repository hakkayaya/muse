<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暮香 MUSE | 手作香氛蠟燭・療癒居家生活</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333;
            background-color: #fff;
            line-height: 1.6;
        }
        /* 頂部導覽列 */
        header {
            border-bottom: 1px solid #eaeaea;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
        }
        .logo {
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 2px;
            line-height: 1.3;
            color: #4a3b32;
        }
        .nav-main {
            display: flex;
            list-style: none;
            gap: 25px;
            font-size: 14px;
            color: #444;
        }
        .nav-main a {
            text-decoration: none;
            color: inherit;
            transition: color 0.2s;
        }
        .nav-main a:hover {
            color: #c4a493;
        }
        .header-icons {
            display: flex;
            gap: 18px;
            font-size: 18px;
            color: #555;
            cursor: pointer;
        }
        
        .header-sub {
            display: flex;
            justify-content: center;
            list-style: none;
            gap: 30px;
            padding: 10px 0;
            font-size: 13px;
            border-top: 1px solid #f8f5f2;
            background-color: #faf7f5;
            color: #666;
        }
        .header-sub a {
            text-decoration: none;
            color: inherit;
        }
        .header-sub a:hover {
            color: #8c6d58;
        }

        /* 主視覺區塊 */
        .hero {
            display: flex;
            min-height: calc(100vh - 110px);
            padding: 60px 80px;
            align-items: center;
            justify-content: space-between;
            background-color: #fff;
            gap: 50px;
        }
        .hero-left {
            flex: 1;
        }
        .subtitle {
            font-size: 16px;
            color: #8c7365;
            letter-spacing: 3px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .brand-en {
            font-size: 38px;
            font-weight: 300;
            letter-spacing: 5px;
            margin-bottom: 5px;
            color: #362e2b;
        }
        .brand-zh {
            font-size: 54px;
            font-weight: bold;
            letter-spacing: 8px;
            margin-bottom: 20px;
            color: #2c221e;
        }
        .desc {
            font-size: 16px;
            color: #666;
            margin-bottom: 35px;
            letter-spacing: 1px;
            max-width: 420px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .btn-shop {
            display: inline-block;
            background-color: #c4a493;
            color: white;
            padding: 14px 36px;
            text-decoration: none;
            letter-spacing: 2px;
            font-size: 14px;
            transition: background 0.3s;
        }
        .btn-shop:hover {
            background-color: #ab8b7a;
        }
        .btn-sample {
            display: inline-block;
            background-color: transparent;
            border: 1px solid #c4a493;
            color: #8c6d58;
            padding: 14px 28px;
            text-decoration: none;
            letter-spacing: 1.5px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-sample:hover {
            background-color: #f8f2ee;
        }

        /* 右側圖片輪播區塊 (帶左右箭頭) */
        .hero-right {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .carousel-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .carousel-wrapper img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            display: block;
            transition: opacity 0.4s ease-in-out;
        }

        /* 左右切換箭頭按鈕 */
        .arrow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.85);
            color: #555;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }
        .arrow-btn:hover {
            background-color: #ffffff;
            color: #c4a493;
            transform: translateY(-50%) scale(1.1);
        }
        .arrow-left {
            left: 15px;
        }
        .arrow-right {
            right: 15px;
        }
    </style>
</head>
<body>

    <!-- 導覽列 -->
    <header>
        <div class="header-top">
            <div class="logo">
                MUSE<br>暮香
            </div>
            <ul class="nav-main">
                <li><a href="#">首頁</a></li>
                <li><a href="#">手作香氛蠟燭 ▾</a></li>
                <li><a href="#">客製化香氛禮盒 ▾</a></li>
                <li><a href="#">線上選香指南</a></li>
                <li><a href="#">關於暮香</a></li>
                <li><a href="#">品牌門市 / 市集資訊 ▾</a></li>
            </ul>
            <div class="header-icons">
                <span>🔍</span>
                <span>👤</span>
                <span>🛍️</span>
            </div>
        </div>
        <ul class="header-sub">
            <li><a href="#">新手入門｜香氛試香卡/小樣體驗組 ▾</a></li>
            <li><a href="#">客製化婚禮小物 / 企業禮品訂製 (10入起)</a></li>
            <li><a href="#">節慶限定專區</a></li>
            <li><a href="#">社群獨家專屬優惠</a></li>
            <li><a href="#">聯絡我們</a></li>
        </ul>
    </header>

    <!-- 主視覺區塊 -->
    <section class="hero">
        <div class="hero-left">
            <div class="subtitle">居家香氛用品 & 質感禮盒</div>
            <div class="brand-en">MUSE</div>
            <div class="brand-zh">暮香香氛</div>
            <div class="desc">營造專屬於你的放鬆氛圍，點亮質感療癒生活。</div>
            <div class="btn-group">
                <a href="#" class="btn-shop">SHOP NOW</a>
                <a href="#" class="btn-sample">索取香卡體驗</a>
            </div>
        </div>
        
        <!-- 右側輪播圖片區塊 -->
        <div class="hero-right">
            <div class="carousel-wrapper">
                <!-- 左箭頭 -->
                <button class="arrow-btn arrow-left" onclick="changeSlide(-1)">&#10094;</button>
                
                <!-- 主視覺圖片 -->
                <img id="hero-image" src="f.jpg" alt="暮香 MUSE 香氛">
                
                <!-- 右箭頭 -->
                <button class="arrow-btn arrow-right" onclick="changeSlide(1)">&#10095;</button>
            </div>
        </div>
    </section>

    <script>
        // 可放置多張圖片的清單（您可以自行替換為真實的圖片網址或檔名）
        const images = [
            'f.jpg',
            'g.jpg',
            'h.jpg',
            'j.jpg'
        ];
        
        let currentIndex = 0;

        function changeSlide(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = images.length - 1;
            } else if (currentIndex >= images.length) {
                currentIndex = 0;
            }
            
            const imgElement = document.getElementById('hero-image');
            imgElement.style.opacity = '0.4';
            setTimeout(() => {
                imgElement.src = images[currentIndex];
                imgElement.style.opacity = '1';
            }, 150);
        }
    </script>

</body>
</html>
